name: second_brain
description: "AI Second Brain — a private, on-device AI reflection journal."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management + routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # On-device AI (primary engine — free, private, offline)
  flutter_gemma: ^0.16.4
  # RAM tier is read via a tiny native MethodChannel (see OnDeviceAiService),
  # since device_info_plus does not expose RAM.

  # Firebase (Auth / Firestore / Functions proxy for Groq / FCM / Remote Config / Analytics / Crashlytics)
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  cloud_functions: ^5.0.4
  firebase_messaging: ^15.0.4
  firebase_remote_config: ^5.0.4
  firebase_analytics: ^11.2.1
  firebase_crashlytics: ^4.0.4
  google_sign_in: ^6.2.1

  # Speech-to-text on device (free, no upload)
  speech_to_text: ^7.0.0

  # Notifications (the daily habit loop)
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4

  # Monetization
  purchases_flutter: ^8.0.0 # RevenueCat

  # Sharing the "Wrapped" insight card (viral loop)
  share_plus: ^10.0.0
  screenshot: ^3.0.0

  # Storage / crypto / misc
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0 # AES-GCM for entry text at rest
  intl: ^0.19.0
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/
